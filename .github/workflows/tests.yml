# Checks the scripts the testers rely on, on every push and pull request.
# Free: no phone, no model, no secret. Offline but for the code-scan job, which fetches Semgrep and the SemSec rules.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.9", os: ubuntu-24.04 }   # the python3 of a Mac without Homebrew, where collect.sh runs
          - { python: "3.13", os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Unit tests (accessibility check, persona matrix, personas, summary, encrypted results)
        run: python3 -m unittest discover -s tests -v
      - name: Every Python script compiles
        run: python3 -m compileall -q scripts tests
      - name: Shell scripts
        if: matrix.python == '3.13'
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
          shellcheck -S warning $(git ls-files '*.sh')

  code-scan:
    # The real Semgrep with the real SemSec rules, on a sample with one known flaw.
    # The unit tests only see stand-ins for Docker: this is what says the engine itself works.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - name: A sample with a known flaw
        run: |
          mkdir -p sample
          cat > sample/app.py <<'EOF'
          import sqlite3
          from flask import Flask, request

          app = Flask(__name__)


          @app.route("/user")
          def user():
              name = request.args.get("name")
              db = sqlite3.connect("app.db")
              rows = db.execute("SELECT * FROM users WHERE name = '" + name + "'").fetchall()
              return str(rows)
          EOF
          # a lock file: package hashes, which the key rules take for keys. It must not be read.
          # (written in two halves: whole, this very file would be reported for holding a key)
          half="sha512-Ixm8tFfoKKIPYdCCKYTsqvAvu"
          printf '{"packages": {"node_modules/a": {"integrity": "%s+3cb6Zp3mAzl+t1MrG2fxxKsxw=="}}}\n' "$half" > sample/package-lock.json
      - name: Code scan (Semgrep + SemSec)
        env:
          TARGET: sample
        run: bash scripts/security/semgrep_scan.sh
      - name: The flaw is found
        run: |
          cat results/sast/meta.json
          python3 - <<'EOF'
          import json
          found = json.load(open("results/sast/sast.json"))["results"]
          print("%d findings:" % len(found), sorted({f["check_id"] for f in found}))
          assert any(f["path"].endswith("app.py") for f in found), "the SQL injection of the sample was not found"
          assert not any("lock" in f["path"] for f in found), "the lock file was scanned"
          EOF
      - name: Semgrep's console, when the scan failed   # a sample, nothing private in it
        if: failure()
        run: cat results/sast/console.log 2>/dev/null | tail -n 80

  test-accounts:
    # On a real runner, with the real sudo: the account is where the agent's tools cannot
    # read it, and the command the agent runs still types it. Made-up values, no secret.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - name: A persona with a role, and its made-up account
        env:
          TEST_ACCOUNTS: '{"owner": {"username": "owner@test.example", "password": "made-up-for-this-check"}, "rep": {"username": "rep@test.example", "password": "another-made-up"}}'
          PERSONA: anna
          PLATFORM: android
        run: |
          python3 - <<'EOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import accounts
          path = Path("personas.json")
          path.write_text(accounts.assign(path.read_text(encoding="utf-8"), "anna", "owner"), encoding="utf-8")
          EOF
          python3 scripts/accounts.py setup
      - name: Out of the agent's reach
        run: |
          if cat /opt/ba3tration/account.json > /dev/null 2>&1; then echo "::error::the account can be read without root"; exit 1; fi
          for f in account.py scripts/android/type.py; do
            test "$(stat -c %U "/opt/ba3tration/$f")" = root
            if ( echo "#" >> "/opt/ba3tration/$f" ) 2> /dev/null; then echo "::error::$f can be edited without root"; exit 1; fi
          done
          sudo grep -q made-up-for-this-check /opt/ba3tration/account.json
          if sudo grep -q another-made-up /opt/ba3tration/account.json; then echo "::error::the account of another role was kept"; exit 1; fi
      - name: Typed for the agent, not told to it
        run: |
          # a stand-in for adb, outside the checkout as the real one is
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/usr/bin/env bash\necho "$*" >> "$ADB_LOG"\n' > "$RUNNER_TEMP/bin/adb"
          chmod +x "$RUNNER_TEMP/bin/adb"
          export ADB_LOG="$RUNNER_TEMP/adb.log" PATH="$RUNNER_TEMP/bin:$PATH"
          python3 /opt/ba3tration/account.py status > said.txt
          python3 /opt/ba3tration/account.py username >> said.txt
          python3 /opt/ba3tration/account.py password >> said.txt
          cat said.txt
          grep -q "role: owner" said.txt
          grep -q "typed the password of the 'owner' test account" said.txt
          if grep -q -e made-up-for-this-check -e owner@test.example said.txt; then echo "::error::a value was told to the agent"; exit 1; fi
          grep -q "shell input text made-up-for-this-check" "$ADB_LOG"

