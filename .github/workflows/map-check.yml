# Checks on a real Android emulator that the robot with no model (scripts/android/crawl.py)
# maps Tiny Todo: it must pass the sign-up form, find the two screens, never delete a
# task, and each start of the app it wrote as a trace must replay with no model.
# No model, no secret, only free runner time (about twenty minutes).
# Started by hand: gh workflow run map-check.yml

name: Map check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAESTRO_VERSION: 2.12.1
      MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7   # of that release's maestro.zip
      MAESTRO_CLI_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - name: Explore-Compile-Replay
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          repository: pierridotite/explore-compile-replay
          ref: f89aa1343119a0b95d95a9342e558b2d6db847ec
          path: .ecr
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with: { node-version: 22 }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3   # v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a   # v4
      - name: Build the demo app
        run: bash scripts/build/android.sh demo-app expo || { tail -n 40 results/build-android.log; exit 1; }
      - name: Explore-Compile-Replay and Maestro
        run: |
          pip install -q pillow
          npm install -g --silent pnpm@10 && (cd .ecr && pnpm install --frozen-lockfile --silent)
          bash scripts/install_maestro.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator, the robot, then the replay
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d   # v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android/map_check.sh app.apk .ecr
