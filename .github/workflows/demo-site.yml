# Publishes the online demo of the dashboard to GitHub Pages: the made-up app, or the runs of a
# public app packed in dashboard/demo-data by scripts/demo_pack.py.
name: Dashboard demo
on:
  workflow_dispatch:   # by hand only: in Ba3tration-tester nothing is published on a push
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.on }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with: { python-version: "3.13" }
      - run: python3 scripts/dashboard.py --demo --export site/
      - name: Is GitHub Pages on
        id: pages
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is off. Turn it on in Settings > Pages > Source: GitHub Actions, then run this workflow again."
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3
        if: steps.pages.outputs.on == 'true'
        with: { path: site }
  # A job of its own, as in GitHub's starter workflow: the artifact is listed once the build job ends.
  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4
